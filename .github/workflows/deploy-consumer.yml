name: Deploy Consumer to EC2

on:
  push:
    branches: [main, develop]
    paths:
      - 'consumer/**'
      - 'src/storage/chromadb.py'
      - 'src/crawler/base.py'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-consumer.yml'

concurrency:
  group: deploy-consumer-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: consumer/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: image
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_IMAGE: ${{ steps.image.outputs.image }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          SSH_OPTS="-o StrictHostKeyChecking=no -i /tmp/ec2_key.pem"

          # docker-compose.prod.yml 을 EC2 로 전송
          scp $SSH_OPTS docker-compose.prod.yml $EC2_USER@$EC2_HOST:~/passroute/docker-compose.yml

          # EC2 에서 ECR 로그인 → 이미지 pull → 컨테이너 재시작
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST << EOF
            cd ~/passroute

            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            export ECR_IMAGE=$ECR_IMAGE
            docker compose pull consumer
            docker compose up -d

            docker image prune -f
          EOF

          rm /tmp/ec2_key.pem
